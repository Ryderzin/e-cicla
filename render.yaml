# Blueprint do Render: publica a API (Docker) e o site (estático) a partir deste repositório.
# Para criar: https://dashboard.render.com -> New -> Blueprint -> escolher este repositório.
# O Render vai pedir o valor de MONGODB_URI (string de conexão do MongoDB Atlas).
services:
  - type: web
    name: e-cicla-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: MONGODB_URI
        sync: false
      # Endereço do site; se o Render gerar outro endereço, atualize aqui.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://e-cicla.onrender.com

  - type: web
    name: e-cicla
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Endereço da API, usado na hora de gerar o site.
      - key: VITE_API_URL
        value: https://e-cicla-api.onrender.com
    # Faz rotas como /mapa funcionarem ao recarregar a página.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
