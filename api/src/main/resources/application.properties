spring.application.name=e-cicla-api
# O Render informa a porta pela variável PORT; localmente, 8080.
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecicla}
# Nome do banco fixo, mesmo que a string de conexão (ex.: a do Atlas) não traga o nome.
spring.data.mongodb.database=ecicla
# Erros da API no formato padrão "problem details" (RFC 9457), com a mensagem do erro
spring.mvc.problemdetails.enabled=true

# Endereços do front-end autorizados a chamar a API (separados por vírgula)
app.cors.allowed-origins=http://localhost:5173

# URL pública do site (usada nos links de recuperação de senha)
app.frontend.url=${APP_FRONTEND_URL:${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}}
# Remetente dos e-mails transacionais (usa o e-mail do SMTP se não definido)
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:nao-responda@e-cicla.com.br}}
# Chave da API do Brevo para envio de e-mails via HTTPS na porta 443 (ideal para o Render gratuito)
app.mail.brevo-api-key=${BREVO_API_KEY:}

# Configurações do SMTP seguro (TLS/STARTTLS e autenticação habilitadas por padrão)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Contas: duração de cada sessão (o navegador fica conectado por esse tempo).
# Administradores: mude o campo "role" da conta para "ADMIN" direto no banco (coleção users).
app.auth.session-days=30

# Importação de pontos (OpenStreetMap + seed manual). Só roda quando ligada:
#   --app.import.on-startup=true
app.import.on-startup=false
app.import.overpass-url=https://overpass-api.de/api/interpreter
app.import.seed-file=classpath:seed/points.json
# Área atendida por enquanto (estado de São Paulo). Pontos novos fora dela são importados desativados.
app.service-area.file=classpath:area/sao-paulo.geojson
# Endereço aproximado (a partir das coordenadas) para pontos que chegam sem endereço.
# Usa o Nominatim do OpenStreetMap: no máximo 1 consulta por segundo e só uma vez por ponto.
app.import.look-up-missing-addresses=true
app.import.nominatim-url=https://nominatim.openstreetmap.org
