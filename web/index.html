<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Encontre no mapa onde descartar celulares, pilhas, carregadores e outros aparelhos eletrônicos." />
    <meta name="theme-color" content="#047857" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ecicla:tema');
          var isDark = t === 'escuro' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
        // Text size chosen with "A−" / "A+" (src/lib/fontSize.ts), applied before the page shows.
        try {
          var f = Number(localStorage.getItem('ecicla:fonte'));
          if ([87.5, 112.5, 125, 150].indexOf(f) >= 0) {
            document.documentElement.style.fontSize = f + '%';
          }
        } catch (e) {}
      })();
    </script>
    <title>E-Cicla</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
